# .github/workflows/reset-branch.yml
name: Reset Branch

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Reset branch to specific commit
        run: |
          git reset --hard 111750258389eec6d57c0e545252d5c4ee711d12
          git push origin HEAD:refs/heads/main --force
